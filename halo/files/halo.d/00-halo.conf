# Настройки веб-сервера от модулей Halo (пакеты halo-mod-*): каталог подключает шаблон
# lighttpd halo, а при halo-preview — строка, которую halo-modules добавляет в шаблон aurora.
# Этот файл — чтобы маска include всегда находила хотя бы один файл, и общее для Halo:

# страница Halo — без кэша: имена файлов сборки меняются при каждой пересборке, а у файлов
# пакета одна и та же дата (воспроизводимая сборка OpenWRT) — без Cache-Control браузер держит
# старый index.html по эвристике (~10% его «возраста») и не находит новых файлов: пустая
# страница. Корень (/) у шаблонов halo и aurora уже no-store; здесь — /halo/ рядом с aurora
$HTTP["url"] =~ "^/(halo/)?(index\.html)?$" {
    setenv.add-response-header = ( "Cache-Control" => "no-store" )
}
