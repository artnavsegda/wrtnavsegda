server.modules += ( "mod_cgi" )

server.modules += ( "mod_setenv" )
include_shell "/etc/lighttpd/envs.sh"

setenv.set-response-header = (
    "X-Content-Type-Options"  => "nosniff",
    "X-Frame-Options"         => "SAMEORIGIN",
    "Referrer-Policy"         => "no-referrer",
    "Permissions-Policy"      => "geolocation=(), microphone=(), camera=()",
    "Content-Security-Policy" => "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'self'; form-action 'self'; object-src 'none';"
)

$HTTP["scheme"] == "https" {
    setenv.set-response-header += (
        "Strict-Transport-Security" => "max-age=63072000; includeSubDomains; preload"
    )
}

$HTTP["url"] =~ "^/$" {
    setenv.add-response-header = ( "Cache-Control" => "no-store" )
}

$HTTP["url"] =~ "^/script" {
    cgi.assign = ( "" => "" )
    setenv.add-response-header = ( "Cache-Control" => "no-store" )
}

$HTTP["url"] =~ ".*\.(js|css)$" {
    setenv.add-response-header = (
        "Content-Encoding" => "gzip",
        "Vary"             => "Accept-Encoding",
        "Cache-Control"    => "no-cache"
    )
}

$HTTP["url"] =~ "^/schema" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}
